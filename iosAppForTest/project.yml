name: A2UIDemoApp
options:
  bundleIdPrefix: com.tencent.kuikly.a2ui
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  A2UIDemoApp:
    type: application
    platform: iOS
    sources:
      # App-specific sources (AppDelegate, main list, Test-only VCs).
      - path: Sources
        type: group
      # Shared sources across all iosAppFor* targets (component tests,
      # custom component/function demos, ObjC handlers, bridging header,
      # A2UIComponentTestViewController, etc.).
      - path: ../iosShared/Sources
        type: group
      # Test-only asset dirs — mirror androidAppForTest/assets. No component
      # / custom_component / custom_function dirs shipped here because
      # A2UIComponentTest in this app resolves via the test-only dirs
      # (databinding_tests / theme_tests / function_tests etc.).
      - path: Resources/a2ui_databinding_tests
        type: folder
        buildPhase: resources
      - path: Resources/a2ui_examples
        type: folder
        buildPhase: resources
      - path: Resources/a2ui_function_tests
        type: folder
        buildPhase: resources
      - path: Resources/a2ui_theme_tests
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tencent.kuikly.a2ui.demo.test
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: ../iosShared/Sources/A2UIDemo-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: "$(inherited) YES"
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
