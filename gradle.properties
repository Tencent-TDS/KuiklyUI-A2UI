#Gradle
org.gradle.jvmargs=-Xmx5120M -Dkotlin.daemon.jvm.options\="-Xmx5120M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.enableJetifier=false
android.injected.testOnly=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

android.disableAutomaticComponentCreation=true

ksp.incremental=true

kotlin.js.webpack.major.version=4

org.gradle.workers.max=4
#org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.experimental.enableArtProfiles=true
compose.compiler.reflection=false

kotlin.native.binary.memoryModel=experimental
jetbrains.compose.compiler.version=1.5.14.1

benchmark=false
compose.ios.resources.sync=false

# ─────────────────────────────────────────────────────────────────────────
# A2UI standalone project — path to the external KuiklyUI checkout that
# provides `:core`, `:core-render-android`, `:compose`, `:core-annotations`,
# `:core-ksp`, `core-render-ohos`, `core-render-ios`, `OpenKuiklyIOSRender`.
#
# This value is read by *all* build tooling (Gradle, Podfiles, setup.sh,
# oh-package.json5 symlinks, ohos build scripts). Change it here to switch
# the whole project to a different KuiklyUI checkout.
#
# May be overridden per-machine in `local.properties` (recommended for
# developer-specific paths) or via the `KUIKLY_PROJECT_DIR` env var.
#
# Path may be absolute, or relative to this project's root directory.
# ─────────────────────────────────────────────────────────────────────────
kuikly.projectDir=../KuiklyUI

# set false for h5 or miniapp
kuikly.useLocalKsp=true
