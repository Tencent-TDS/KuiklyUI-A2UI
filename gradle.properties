#Gradle
org.gradle.jvmargs=-Xmx5120M -Dkotlin.daemon.jvm.options\="-Xmx5120M"

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.enableJetifier=false
android.injected.testOnly=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

android.disableAutomaticComponentCreation=true

ksp.incremental=true

kotlin.js.webpack.major.version=4

org.gradle.workers.max=4
#org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.experimental.enableArtProfiles=true
compose.compiler.reflection=false

kotlin.native.binary.memoryModel=experimental
jetbrains.compose.compiler.version=1.5.14.1

benchmark=false
compose.ios.resources.sync=false

# ─────────────────────────────────────────────────────────────────────────
# A2UI standalone project — path to the external KuiklyUI checkout that
# provides `:core`, `:core-render-android`, `:compose`, `:core-annotations`,
# `:core-ksp`, `core-render-ohos`, `core-render-ios`, `OpenKuiklyIOSRender`.
#
# This value is read by *all* build tooling (Gradle, Podfiles, setup.sh,
# oh-package.json5 symlinks, ohos build scripts). Change it here to switch
# the whole project to a different KuiklyUI checkout.
#
# May be overridden per-machine in `local.properties` (recommended for
# developer-specific paths) or via the `KUIKLY_PROJECT_DIR` env var.
#
# Path may be absolute, or relative to this project's root directory.
# ─────────────────────────────────────────────────────────────────────────
kuikly.projectDir=../KuiklyUI

# ─────────────────────────────────────────────────────────────────────────
# KuiklyUI dependency mode:
#   false (default) — consume published Maven artifacts from
#                     `com.tencent.kuikly-open:<module>:<coord-version>`;
#                     `kuikly.projectDir` above is NOT required.
#   true            — consume the local KuiklyUI checkout as source
#                     (requires `kuikly.projectDir` to resolve).
#
# Override order:
#   -Pkuikly.useSource=... | KUIKLY_USE_SOURCE env | local.properties
# ─────────────────────────────────────────────────────────────────────────
kuikly.useSource=false

# ─────────────────────────────────────────────────────────────────────────
# Upstream KuiklyUI base version — used *verbatim*, i.e. the trailing
# `-SNAPSHOT` (if any) must be spelled out explicitly here. The Kotlin
# toolchain segment is then inserted automatically to form the final
# Maven coordinate, following the convention used by Kuikly Core when
# publishing its core/compose/ksp artifacts. Only consumed when
# `kuikly.useSource=false`.
#
# Examples (Kotlin 2.1.21 toolchain):
#   kuikly.version=2.29.2           → com.tencent.kuikly-open:core:2.29.2-2.1.21
#   kuikly.version=2.29.2-SNAPSHOT  → com.tencent.kuikly-open:core:2.29.2-2.1.21-SNAPSHOT
#
# Override order:
#   -Pkuikly.version=... | KUIKLY_VERSION env | local.properties
# ─────────────────────────────────────────────────────────────────────────
kuikly.version=2.29.2

# set false for h5 or miniapp
kuikly.useLocalKsp=true
